<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <title>autoshop</title>
</head>

<body>
    <div id="header-placeholder"></div>
    <main class="catalog-page">
        <div class="container-main">

            <div class="catalog-tabs">
                <a href="/shiny.html" class="catalog-tab">Шины</a>
                <a href="/diski.html" class="catalog-tab is-active">Диски</a>
            </div>

            <div class="catalog-header">
                <div class="catalog-header__text">
                    <div class="breadcrumbs">Шины и диски</div>
                    <h1 class="catalog-title">Диски</h1>
                    <div class="catalog-count">Найдено * товаров</div>
                </div>

                <div class="catalog-sort desktop-only">
                    <select class="sort-select">
                        <option value="cheap">Сначала дешевле</option>
                        <option value="expensive">Сначала дороже</option>
                    </select>
                </div>
            </div>

            <div class="mobile-actions">
                <button class="mobile-action-btn" type="button">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 6h18M6 12h12M10 18h4" />
                    </svg>
                    Сначала дешевле
                </button>
                <button class="mobile-action-btn" id="openMobileFilters" type="button">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="10" cy="10" r="7" />
                        <path d="M21 21l-6-6" />
                    </svg>
                    Фильтры
                </button>
            </div>

            <div class="catalog-layout">

                <aside class="catalog-sidebar" id="mobileFilterMenu">

                    <div class="sidebar-mobile-header">
                        <h2>Фильтры</h2>
                        <button class="close-filters-btn" id="closeMobileFilters" type="button">&times;</button>
                    </div>

                    <div class="filter-group">
                        <details class="filter-dropdown">
                            <summary>Сверловка (PCD)</summary>
                            <div class="filter-options" id="filterBoltList"></div>
                        </details>
                    </div>

                    <div class="filter-group">
                        <details class="filter-dropdown">
                            <summary>Диаметр (R)</summary>
                            <div class="filter-options" id="filterDiaList"></div>
                        </details>
                    </div>

                    <div class="filter-group">
                        <details class="filter-dropdown">
                            <summary>Ширина (J)</summary>
                            <div class="filter-options" id="filterWidthList"></div>
                        </details>
                    </div>

                    <div class="filter-group">
                        <details class="filter-dropdown">
                            <summary>Вылет (ET)</summary>
                            <div class="filter-options" id="filterEtList"></div>
                        </details>
                    </div>

                    <div class="filter-group">
                        <details class="filter-dropdown">
                            <summary>ЦО (DIA)</summary>
                            <div class="filter-options" id="filterCbList"></div>
                        </details>
                    </div>

                    <div class="filter-group">
                        <h3 class="filter-title">Производитель</h3>
                        <div class="filter-options brand-list is-collapsed" id="brandList"></div>
                        <span class="filter-show-more" id="showMoreBrandsBtn">Показать все</span>
                    </div>

                    <div class="filter-actions is-hidden" id="filterActions">
                        <button class="btn-outline filter-reset-full" type="button" id="resetFiltersBtn">Сбросить фильтры</button>
                    </div>
                </aside>

                <div class="catalog-content">
                    <div class="catalog-grid">

                        

                    </div>
                </div>

            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
</body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/diski-page.js"></script>
<script src="js/load-components.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>

</html>
